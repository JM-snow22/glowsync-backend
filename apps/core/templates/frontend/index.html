      catch(e){const box=$("#login-error");if(box)box.innerHTML=`<div class="err">${esc(t("bad"))}</div>`;btn.disabled=false;btn.textContent=t("login")}};return}
  const me=S.me;
  $("#app").innerHTML=`<div class="app"><aside class="side"><div class="logo"><i>✦</i> GlowSync</div><nav>${MENU[me.rol].map(v=>`<a href="#/${v}"><span>${ICON[v]}</span>${t(v)}</a>`).join("")}</nav>
  <div class="me"><div class="av">${esc(ini(me.nombre))}</div><div><b>${esc(me.nombre)}</b><small>${t(me.rol)}</small></div></div><div class="ctl">${langSel()}<button class="sm" id="out">${t("logout")}</button></div></aside>
  <section class="body"><div class="top"><h1 id="ttl"></h1><span>${new Date().toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"})}</span></div><main id="m"></main></section></div>`;
  $("#lg").onchange=e=>setLang(e.target.value);$("#out").onclick=()=>logout();go()}
async function go(){
  if(!S)return;const v=(location.hash||"").slice(2)||MENU[S.me.rol][0],m=$("#m");if(!m)return draw();
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+v));$("#ttl").textContent=t(v)||"";
  if(!MENU[S.me.rol].includes(v)){m.innerHTML=`<div class="card"><div class="err">${t("denied")}</div></div>`;return}
  m.innerHTML='<div class="sk"></div><div class="sk"></div>';
  try{m.innerHTML=await VIEWS[v]()}catch(e){m.innerHTML=`<div class="card"><div class="err">${esc(e.message)}</div></div>`}bind()}
window.onhashchange=go;
const VIEWS={
 async dashboard(){const d=await api("/api/dashboard/resumen/"),pct=Math.round(d.tasa_inasistencia*1000)/10;
  return `<div class="card hi"><div><small>${t("recovered")}</small><b>${money(d.dinero_recuperado)}</b><p>${t("recNote")}</p></div><div style="font-size:64px">🌸</div></div>
  <div class="kpi"><div class="card"><div class="ic">🗓️</div><div><small>${t("k1")}</small><b>${d.citas_total}</b></div></div>
  <div class="card"><div class="ring" style="--p:${pct}"><span>${pct.toFixed(1)}%</span></div><div><small>${t("k2")}</small></div></div>
  <div class="card"><div class="ic">💰</div><div><small>${t("k4")}</small><b>${money(d.ingresos_aprobados)}</b></div></div>
  <div class="card"><div class="ic">⚡</div><div><small>${t("k5")}</small><b>${d.ofertas_aceptadas}</b></div></div></div>`},
 async citas(){const d=await api("/api/citas/?ordering=hora_inicio&hora_inicio__gte="+encodeURIComponent(new Date().toISOString()));
  if(!d.results.length)return `<div class="card">${empty("🗓️",t("eC"))}</div>`;
  const g={};d.results.forEach(c=>{const k=new Date(c.hora_inicio).toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"});(g[k]=g[k]||[]).push(c)});
  return `<div class="card">${cnt(d)}${Object.entries(g).map(([k,l])=>`<h3 class="day">${esc(k)}</h3>${l.map(c=>`<div class="row"><div class="hr">${new Date(c.hora_inicio).toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"})}</div>
   <div class="av">${esc(ini(c.clienta_nombre))}</div><div class="grow"><b>${esc(c.clienta_nombre)}</b><small>${esc(c.servicio_nombre)}</small></div>${pill(c.estado)}
   ${can("citas")&&["PENDIENTE","CONFIRMADA"].includes(c.estado)?`<div class="acts">${c.estado==="PENDIENTE"?`<button class="sm" data-a="${c.id}:confirmar">${t("confirm")}</button>`:""}<button class="sm d" data-a="${c.id}:cancelar">${t("cancel")}</button></div>`:""}</div>`).join("")}`).join("")}</div>`},
 async clientas(){const q=window._q||"",d=await api("/api/clientas/?search="+encodeURIComponent(q));
  return `<div class="card"><input id="q" class="search" placeholder="${t("search")}" value="${esc(q)}">${d.results.length?cnt(d)+`<div class="grid">${d.results.map(c=>`<div class="tile"><div class="h"><div class="av">${esc(ini(c.nombre))}</div><div><b>${esc(c.nombre)}</b><small>📱 ${esc(c.telefono_whatsapp)}</small></div></div><div class="tags">${pill("",c.idioma==="en"?"English":"Español")}</div></div>`).join("")}</div>`:empty("👩",t("eCl"))}</div>`},
 async fichas(){const d=await api("/api/fichas/");window._F={};d.results.forEach(f=>window._F[f.id]=f);
  return `<div class="card">${d.results.length?cnt(d)+`<div class="grid">${d.results.map(f=>`<div class="tile"><div class="h"><div class="av">#${f.clienta}</div><div><b>${t("skin")}: ${esc(f.tipo_cutis||"—")}</b><small>${esc(f.observaciones||"")}</small></div></div>
   <div class="tags">${f.alergias?`<span class="pill no">⚠ ${esc(f.alergias)}</span>`:`<span class="pill ok">${t("noAl")}</span>`}</div>${can("fichas")?`<div><button class="sm" data-f="${f.id}">${t("edit")}</button></div>`:""}</div>`).join("")}</div>`:empty("📋",t("eF"))}</div>`},
 async usuarios(){const d=await api("/api/usuarios/");return `<div class="card"><h2>${t("usuarios")}</h2>${d.results.length?`<div class="tw"><table><tr><th>${t("name")}</th><th>${t("email")}</th><th>${t("rol")}</th><th>${t("active")}</th></tr>${d.results.map(u=>`<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.email)}</td><td>${pill("",t(u.rol))}</td><td>${u.is_active?"✔":"✖"}</td></tr>`).join("")}</table></div>`:empty("👥",t("eU"))}</div>
  <div class="card"><h2>${t("newUser")}</h2><form id="nu" class="fg"><div><label>${t("name")}</label><input name="nombre" required></div><div><label>${t("email")}</label><input name="email" type="email" required></div>
  <div><label>${t("rol")}</label><select name="rol"><option value="ESTETICISTA">${t("ESTETICISTA")}</option><option value="RECEPCIONISTA">${t("RECEPCIONISTA")}</option></select></div><div><label>${t("pass")}</label><input name="password" type="password" minlength="8" required></div><div><button class="pri">${t("create")}</button></div></form></div>`},
 async centros(){const d=await api("/api/centros/");return `<div class="card"><h2>${t("centros")}</h2><div class="tw"><table><tr><th>ID</th><th>${t("name")}</th><th>${t("plan")}</th><th>${t("state")}</th><th>${t("expires")}</th></tr>${d.results.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.nombre)}</b></td><td>${pill("",c.plan)}</td><td>${pill(c.estado_suscripcion)}</td><td>${esc(c.fecha_vencimiento)}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>${t("newCentro")}</h2><form id="nc" class="fg"><div><label>${t("name")}</label><input name="nombre" required></div><div><label>${t("city")}</label><input name="ciudad"></div>
  <div><label>${t("plan")}</label><select name="plan"><option>BASICO</option><option>PRO</option><option>PREMIUM</option></select></div><div><label>${t("expires")}</label><input name="fecha_vencimiento" type="date" required></div><div><button class="pri">${t("create")}</button></div></form></div>
  <div class="card"><h2>${t("centroUser")}</h2><form id="cu" class="fg"><div><label>${t("centro")}</label><select name="centro">${d.results.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></div>
  <div><label>${t("name")}</label><input name="nombre" required></div><div><label>${t("email")}</label><input name="email" type="email" required></div><div><label>${t("pass")}</label><input name="password" type="password" minlength="8" required></div>
  <input type="hidden" name="rol" value="RECEPCIONISTA"><div><button class="pri">${t("create")}</button></div></form></div>`},
 async rbac(){const R=["ADMIN_SAAS","RECEPCIONISTA","ESTETICISTA"],rows=["dashboard","citas","clientas","fichas","usuarios","centros"].map(v=>`<tr><td><b>${ICON[v]} ${t(v)}</b></td>${R.map(r=>`<td>${!MENU[r].includes(v)?`<span class="pill">✖ ${t("none")}</span>`:WRITE[v].includes(r)?`<span class="pill ok">✔ ${t("full")}</span>`:`<span class="pill v">👁 ${t("view")}</span>`}</td>`).join("")}</tr>`).join("");
  return `<div class="card"><h2>${t("matrix")}</h2><div class="tw"><table><tr><th></th>${R.map(r=>`<th>${t(r)}</th>`).join("")}</tr>${rows}</table></div><p class="mut" style="font-size:13px;margin-top:14px">${t("note")}</p></div>`}};
function modal(title,body,onsub){const o=document.createElement("div");o.className="ov";o.innerHTML=`<form class="mod" id="mf"><h2>${title}</h2>${body}<div class="act"><button type="button" class="ghost" id="mc">${t("cancel")}</button><button class="pri">${t("save")}</button></div></form>`;document.body.appendChild(o);
  o.querySelector("#mc").onclick=()=>o.remove();o.querySelector("#mf").onsubmit=async e=>{e.preventDefault();try{await onsub(Object.fromEntries(new FormData(e.target)));o.remove()}catch(x){toast(x.message,0)}}}
function bind(){
  const q=$("#q");if(q)q.onchange=()=>{window._q=q.value;go()};
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const[id,a]=b.dataset.a.split(":");if(a==="cancelar"&&window.confirm&&!confirm(t("askCancel")))return;try{await api(`/api/citas/${id}/${a}/`,{method:"POST"});toast(t("saved"));go()}catch(e){toast(e.message,0)}});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=window._F[b.dataset.f];
    modal(t("fichas")+" #"+f.clienta,`<label>${t("skin")}</label><input name="tipo_cutis" value="${esc(f.tipo_cutis)}"><label>${t("allergy")}</label><input name="alergias" value="${esc(f.alergias)}"><label>${t("obs")}</label><textarea name="observaciones" rows="3">${esc(f.observaciones)}</textarea>`,
    async d=>{await api(`/api/fichas/${f.id}/`,{method:"PATCH",body:d});toast(t("saved"));go()})});
  const post=(id,url,fix)=>{const f=$(id);if(f)f.onsubmit=async ev=>{ev.preventDefault();try{let d=Object.fromEntries(new FormData(f)),u=url;if(fix){u=url.replace("{c}",d.centro);delete d.centro}await api(u,{method:"POST",body:d});toast(t("saved"));f.reset();setTimeout(go,600)}catch(e){toast(e.message,0)}}};
  post("#nu","/api/usuarios/");post("#nc","/api/centros/");post("#cu","/api/centros/{c}/usuarios/",1)}
if(S){api("/api/auth/me/").then(me=>{S.me=me;save();draw()}).catch(()=>logout())}else draw();
</script></body></html>
