let activeMatrix=null;
async function loadPermissions(){
  if(!S || (S.me.rol==="ADMIN_SAAS"&&!selectedCentro)){activeMatrix=null;return}
  try{
    const data=await api("/api/rbac/");activeMatrix=data.matriz;
    const roles=["ADMIN_SAAS","ADMIN_NEGOCIO","RECEPCIONISTA","ESTETICISTA"];
    const baseOrder=["centros","dashboard","citas","clientas","fichas","usuarios","rbac"];
    for(const rol of roles){
      MENU[rol]=baseOrder.filter(v=>v==="rbac"||(activeMatrix[v]&&activeMatrix[v][rol]>0));
    }
    WRITE={};for(const [v,rs] of Object.entries(activeMatrix))WRITE[v]=roles.filter(r=>rs[r]===2);
  }catch(err){toast(err.message,0);throw err}
}
const can=v=>(WRITE[v]||[]).includes(S.me.rol),save=()=>sessionStorage.setItem("gs",JSON.stringify(S));

const empty=(i,m)=>`<div class="empty"><b>${i}</b>${m}</div>`,cnt=d=>`<p class="cnt">${t("showing")} ${d.results.length} ${t("of")} ${d.count}</p>`;
function toast(m,ok=1){const e=document.createElement("div");e.className="toast"+(ok?"":" bad");e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function msg(d){if(!d)return"";if(d.detail)return d.detail;return Object.entries(d).map(([k,v])=>k+": "+[].concat(v).join(" ")).join(" · ")}
async function refresh(){try{const r=await fetch("/api/auth/refresh/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh:S.refresh})});if(!r.ok)return false;S.access=(await r.json()).access;save();return true}catch(e){return false}}
// Respuestas recientes por sesión y sede; nunca se guardan en disco.
const responseCache=new Map();
const CACHE_MS=20000;
function clearResponseCache(){responseCache.clear()}
function cachedGet(path){
  const tenant=S?.me?.rol==="ADMIN_SAAS"?selectedCentro:(S?.me?.centro||S?.me?.centro_id||"");
  const key=JSON.stringify([S?.me?.id,tenant,lang,path]);
  const previous=responseCache.get(key);
  if(previous && Date.now()-previous.when<CACHE_MS)return previous.promise;
  const promise=api(path).catch(err=>{responseCache.delete(key);throw err});
  responseCache.set(key,{when:Date.now(),promise});
  return promise;
}
function prefetchView(v){
  if(!S)return;
  if(S.me.rol==="ADMIN_SAAS"&&!selectedCentro&&v!=="centros")return;
  const routes={dashboard:"/api/dashboard/resumen/",clientas:"/api/clientas/?search=" ,fichas:"/api/fichas/",usuarios:"/api/usuarios/",centros:"/api/centros/"};
  const path=routes[v];if(path)cachedGet(path).catch(()=>{});
}
async function api(path,o={},retry=true){
  const h={"Content-Type":"application/json","Accept-Language":lang};if(S&&S.access)h.Authorization="Bearer "+S.access;if(S?.me?.rol==="ADMIN_SAAS"&&selectedCentro)h["X-Centro-ID"]=selectedCentro;
  const r=await fetch(path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===401&&retry&&S&&S.refresh){if(await refresh())return api(path,o,false);logout(t("expired"));throw new Error(t("expired"))}
  const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(msg(d)||r.status);if(o.method&&o.method!=="GET")clearResponseCache();return d}
function logout(m){clearResponseCache();S=null;selectedCentro="";sessionStorage.removeItem("gs_centro");sessionStorage.removeItem("gs");location.hash="";draw(m)}

async function setLang(v){clearResponseCache();lang=v;localStorage.setItem("lang",v);document.documentElement.lang=v;if(S){try{await api("/api/auth/me/",{method:"PATCH",body:{idioma:v}})}catch(e){}S.me.idioma=v;save()}draw()}

      <label for="p">${t("pass")}</label><div class="password-field"><input id="p" type="password" autocomplete="current-password" required>
      <button type="button" id="toggle-password" class="password-toggle" aria-label="${lang==="es"?"Mostrar contraseña":"Show password"}">${lang==="es"?"Mostrar":"Show"}</button></div>
      <button type="submit" class="pri wide" id="login-submit">${t("login")}</button>
      <div class="auth-note">GlowSync · ${lang==="es"?"Tu espacio de trabajo, en orden.":"Your workspace, beautifully organized."}</div></form></div></section></div>`;
    $("#lg").onchange=e=>setLang(e.target.value);
    $("#toggle-password").onclick=()=>{const p=$("#p"),b=$("#toggle-password"),show=p.type==="password";p.type=show?"text":"password";b.textContent=show?(lang==="es"?"Ocultar":"Hide"):(lang==="es"?"Mostrar":"Show");b.setAttribute("aria-label",lang==="es"?(show?"Ocultar contraseña":"Mostrar contraseña"):(show?"Hide password":"Show password"))};

      clearResponseCache();S={access:d.access,refresh:d.refresh,me:d.usuario};lang=S.me.idioma||lang;localStorage.setItem("lang",lang);save();draw();loadPermissions().then(()=>draw()).catch(()=>{})}
      catch(e){const box=$("#login-error");if(box)box.innerHTML=`<div class="err">${esc(t("bad"))}</div>`;btn.disabled=false;btn.textContent=t("login")}};return}
  const me=S.me;
  $("#app").innerHTML=`<div class="app"><aside class="side"><div class="logo"><i>✦</i> GlowSync</div><nav>${MENU[me.rol].map(v=>`<a href="#/${v}"><span>${ICON[v]}</span>${t(v)}</a>`).join("")}</nav>
  ${me.rol==="ADMIN_SAAS"?`<div class="tenant-chooser"><label for="tenant-select">${lang==="es"?"Sede activa":"Active location"}</label><select id="tenant-select"><option value="">${lang==="es"?"Selecciona un negocio":"Select business"}</option></select></div>`:""}
  <div class="me"><div class="av">${esc(ini(me.nombre))}</div><div><b>${esc(me.nombre)}</b><small>${t(me.rol)}</small></div></div><div class="ctl">${langSel()}<button class="sm" id="out">${t("logout")}</button></div></aside>
  <section class="body"><div class="top"><h1 id="ttl"></h1><span>${new Date().toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"})}</span></div><main id="m"></main></section></div>`;
  $("#lg").onchange=e=>setLang(e.target.value);$("#out").onclick=()=>logout();if(me.rol==="ADMIN_SAAS")loadCentros();go()}
async function loadCentros(){const el=$("#tenant-select");if(!el)return;try{const data=await cachedGet("/api/centros/");const items=data.results||data;el.innerHTML=`<option value="">${lang==="es"?"Selecciona un negocio":"Select business"}</option>`+items.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("");if(!items.some(c=>String(c.id)===selectedCentro)){selectedCentro="";sessionStorage.removeItem("gs_centro")}el.value=selectedCentro;el.onchange=()=>{selectedCentro=el.value;sessionStorage.setItem("gs_centro",selectedCentro);clearResponseCache();loadPermissions().then(()=>draw()).catch(()=>go())}}catch(e){toast(e.message,0)}}
let navigationVersion=0;
async function go(){
  const currentVersion=++navigationVersion;
  if(!S)return;const v=(location.hash||"").slice(2)||MENU[S.me.rol][0],m=$("#m");if(!m)return draw();
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+v));$("#ttl").textContent=t(v)||"";
  if(!MENU[S.me.rol].includes(v)){m.innerHTML=`<div class="card"><div class="err">${t("denied")}</div></div>`;return}
  if(S.me.rol==="ADMIN_SAAS"&&v!=="centros"&&v!=="rbac"&&!selectedCentro){m.innerHTML=`<div class="card empty">${lang==="es"?"Selecciona una sede en el menú lateral para gestionar sus datos.":"Choose a location in the sidebar to manage its data."}</div>`;return}
  const version=currentVersion;
  m.innerHTML='<div class="sk"></div><div class="sk"></div>';
  try{const html=await VIEWS[v]();if(version!==navigationVersion)return;m.innerHTML=html}catch(e){if(version!==navigationVersion)return;m.innerHTML=`<div class="card"><div class="err">${esc(e.message)}</div></div>`}bind()}

   ${can("citas")&&["PENDIENTE","CONFIRMADA"].includes(c.estado)?`<div class="acts">${c.estado==="PENDIENTE"?`<button class="sm" data-a="${c.id}:confirmar">${t("confirm")}</button>`:""}<button class="sm d" data-a="${c.id}:cancelar">${t("cancel")}</button></div>`:""}</div>`).join("")}`).join("")}</div>`},
 async clientas(){const q=window._q||"",d=await cachedGet("/api/clientas/?search="+encodeURIComponent(q));
  return `<div class="card"><input id="q" class="search" placeholder="${t("search")}" value="${esc(q)}">${d.results.length?cnt(d)+`<div class="grid">${d.results.map(c=>`<div class="tile"><div class="h"><div class="av">${esc(ini(c.nombre))}</div><div><b>${esc(c.nombre)}</b><small>📱 ${esc(c.telefono_whatsapp)}</small></div></div><div class="tags">${pill("",c.idioma==="en"?"English":"Español")}</div></div>`).join("")}</div>`:empty("👩",t("eCl"))}</div>`},
 async fichas(){const d=await cachedGet("/api/fichas/");window._F={};d.results.forEach(f=>window._F[f.id]=f);
  return `<div class="card">${d.results.length?cnt(d)+`<div class="grid">${d.results.map(f=>`<div class="tile"><div class="h"><div class="av">#${f.clienta}</div><div><b>${t("skin")}: ${esc(f.tipo_cutis||"—")}</b><small>${esc(f.observaciones||"")}</small></div></div>
   <div class="tags">${f.alergias?`<span class="pill no">⚠ ${esc(f.alergias)}</span>`:`<span class="pill ok">${t("noAl")}</span>`}</div>${can("fichas")?`<div><button class="sm" data-f="${f.id}">${t("edit")}</button></div>`:""}</div>`).join("")}</div>`:empty("📋",t("eF"))}</div>`},
 async usuarios(){const d=await cachedGet("/api/usuarios/");return `<div class="card"><h2>${t("usuarios")}</h2>${d.results.length?`<div class="tw"><table><tr><th>${t("name")}</th><th>${t("email")}</th><th>${t("rol")}</th><th>${t("active")}</th></tr>${d.results.map(u=>`<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.email)}</td><td>${pill("",t(u.rol))}</td><td>${u.is_active?"✔":"✖"}</td></tr>`).join("")}</table></div>`:empty("👥",t("eU"))}</div>
  <div class="card"><h2>${t("newUser")}</h2><form id="nu" class="fg"><div><label>${t("name")}</label><input name="nombre" required></div><div><label>${t("email")}</label><input name="email" type="email" required></div>
  <div><label>${t("rol")}</label><select name="rol"><option value="ESTETICISTA">${t("ESTETICISTA")}</option><option value="RECEPCIONISTA">${t("RECEPCIONISTA")}</option></select></div><div><label>${t("pass")}</label><input name="password" type="password" minlength="8" required></div><div><button class="pri">${t("create")}</button></div></form></div>`},
 async centros(){const d=await cachedGet("/api/centros/");return `<div class="card"><h2>${t("centros")}</h2><div class="tw"><table><tr><th>ID</th><th>${t("name")}</th><th>${t("plan")}</th><th>${t("state")}</th><th>${t("expires")}</th></tr>${d.results.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.nombre)}</b></td><td>${pill("",c.plan)}</td><td>${pill(c.estado_suscripcion)}</td><td>${esc(c.fecha_vencimiento)}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>${t("newCentro")}</h2><form id="nc" class="fg"><div><label>${t("name")}</label><input name="nombre" required></div><div><label>${t("city")}</label><input name="ciudad"></div>
  <div><label>${t("plan")}</label><select name="plan"><option>BASICO</option><option>PRO</option><option>PREMIUM</option></select></div><div><label>${t("expires")}</label><input name="fecha_vencimiento" type="date" required></div><div><button class="pri">${t("create")}</button></div></form></div>
  <div class="card"><h2>${t("centroUser")}</h2><form id="cu" class="fg"><div><label>${t("centro")}</label><select name="centro">${d.results.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></div>
  <div><label>${t("name")}</label><input name="nombre" required></div><div><label>${t("email")}</label><input name="email" type="email" required></div><div><label>${t("pass")}</label><input name="password" type="password" minlength="8" required></div>
  <div><label>${t("rol")}</label><select name="rol"><option value="ADMIN_NEGOCIO">${t("ADMIN_NEGOCIO")}</option><option value="RECEPCIONISTA">${t("RECEPCIONISTA")}</option><option value="ESTETICISTA">${t("ESTETICISTA")}</option></select></div><div><button class="pri">${t("create")}</button></div></form></div>`},
 async rbac(){
  if(S.me.rol==="ADMIN_SAAS"&&!selectedCentro)return `<div class="card empty">${lang==="es"?"Selecciona primero un negocio en el menú lateral para editar sus permisos.":"Select a business first to edit permissions."}</div>`;
  const data=await api("/api/rbac/");activeMatrix=data.matriz;
  const R=["ADMIN_SAAS","ADMIN_NEGOCIO","RECEPCIONISTA","ESTETICISTA"];
  const rows=["dashboard","citas","clientas","fichas","usuarios","centros"].map(v=>`<tr><td><b>${ICON[v]} ${t(v)}</b></td>${R.map(r=>{
    const level=data.matriz[v][r], locked=r==="ADMIN_SAAS"||v==="centros";
    if(!data.editable||locked)return `<td>${level===0?`<span class="pill">✖ ${t("none")}</span>`:level===1?`<span class="pill v">👁 ${t("view")}</span>`:`<span class="pill ok">✔ ${t("full")}</span>`}</td>`;
    return `<td><select class="rbac-cell" data-module="${v}" data-role="${r}" aria-label="${t(v)} ${t(r)}"><option value="0" ${level===0?"selected":""}>✖ ${t("none")}</option><option value="1" ${level===1?"selected":""}>👁 ${t("view")}</option>${v!=="dashboard"?`<option value="2" ${level===2?"selected":""}>✔ ${t("full")}</option>`:""}</select></td>`;
  }).join("")}</tr>`).join("");
  const buttons=data.editable?`<div class="act"><button type="button" class="ghost" id="rbac-reset">${lang==="es"?"Restaurar predeterminados":"Reset defaults"}</button><button type="button" class="pri" id="rbac-save">${t("save")}</button></div>`:"";
  return `<div class="card"><h2>${t("matrix")}</h2><div class="tw"><table><tr><th></th>${R.map(r=>`<th>${t(r)}</th>`).join("")}</tr>${rows}</table></div>${buttons}<p class="mut" style="font-size:13px;margin-top:14px">${t("note")}</p></div>`
}};
function modal(title,body,onsub){const o=document.createElement("div");o.className="ov";o.innerHTML=`<form class="mod" id="mf"><h2>${title}</h2>${body}<div class="act"><button type="button" class="ghost" id="mc">${t("cancel")}</button><button class="pri">${t("save")}</button></div></form>`;document.body.appendChild(o);
  o.querySelector("#mc").onclick=()=>o.remove();o.querySelector("#mf").onsubmit=async e=>{e.preventDefault();try{await onsub(Object.fromEntries(new FormData(e.target)));o.remove()}catch(x){toast(x.message,0)}}}
function bind(){
  const rbacSave=$("#rbac-save"),rbacReset=$("#rbac-reset");
  if(rbacSave)rbacSave.onclick=async()=>{
    rbacSave.disabled=true;
    try{
      const next=JSON.parse(JSON.stringify(activeMatrix));
      document.querySelectorAll(".rbac-cell").forEach(el=>{next[el.dataset.module][el.dataset.role]=Number(el.value)});
      await api("/api/rbac/",{method:"PUT",body:{matriz:next}});
      await loadPermissions();toast(t("saved"));draw();
    }catch(e){toast(e.message,0);rbacSave.disabled=false}
  };
  if(rbacReset)rbacReset.onclick=async()=>{
    if(!confirm(lang==="es"?"¿Restaurar los permisos predeterminados de este negocio?":"Reset permissions for this business?"))return;
    try{await api("/api/rbac/",{method:"DELETE"});await loadPermissions();toast(t("saved"));draw()}catch(e){toast(e.message,0)}
  };
  const q=$("#q");if(q)q.onchange=()=>{window._q=q.value;go()};
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const[id,a]=b.dataset.a.split(":");if(a==="cancelar"&&window.confirm&&!confirm(t("askCancel")))return;try{await api(`/api/citas/${id}/${a}/`,{method:"POST"});toast(t("saved"));go()}catch(e){toast(e.message,0)}});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=window._F[b.dataset.f];
    modal(t("fichas")+" #"+f.clienta,`<label>${t("skin")}</label><input name="tipo_cutis" value="${esc(f.tipo_cutis)}"><label>${t("allergy")}</label><input name="alergias" value="${esc(f.alergias)}"><label>${t("obs")}</label><textarea name="observaciones" rows="3">${esc(f.observaciones)}</textarea>`,
    async d=>{await api(`/api/fichas/${f.id}/`,{method:"PATCH",body:d});toast(t("saved"));go()})});
  const post=(id,url,fix)=>{const f=$(id);if(f)f.onsubmit=async ev=>{ev.preventDefault();try{let d=Object.fromEntries(new FormData(f)),u=url;if(fix){u=url.replace("{c}",d.centro);delete d.centro}await api(u,{method:"POST",body:d});toast(t("saved"));f.reset();setTimeout(go,600)}catch(e){toast(e.message,0)}}};
  post("#nu","/api/usuarios/");post("#nc","/api/centros/");post("#cu","/api/centros/{c}/usuarios/",1)}
if(S){api("/api/auth/me/").then(me=>{S.me=me;save();return loadPermissions().catch(()=>{})}).then(()=>draw()).catch(()=>logout())}else draw();
</script></body></html>
