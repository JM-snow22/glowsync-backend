services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: glowsync
      POSTGRES_USER: glowsync
      POSTGRES_PASSWORD: glowsync
    ports: ["5432:5432"]          # para conectarte desde tu PC (python manage.py ...)
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowsync"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  web:
    build: .
    env_file: .env
    environment: &entorno
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    env_file: .env
    environment: *entorno
    command: celery -A config worker -l info
    depends_on: [web]

volumes:
  pgdata:
  redisdata: